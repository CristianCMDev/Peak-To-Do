<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="m1"></ion-menu-button>
    </ion-buttons>
    <ion-title>PeakToDo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">PeakToDo</ion-title>
    </ion-toolbar>

    <ion-item lines="none">
      <ion-searchbar [(ngModel)]="searchText" (ionInput)="filtrarTareas()" placeholder="Buscar tareas...">
      </ion-searchbar>
      <ion-buttons slot="end">
        <ion-button (click)="modalFiltro.present()">
          <ion-icon [icon]="funnelIcon" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-header>

  <ion-item>
    <div class="selected-tags" *ngIf="selectedFilterCategories.length > 0">
      <span class="category" *ngFor="let cat of selectedFilterCategories">{{ cat }}</span>
    </div>
  </ion-item>

  <app-create-task (tareaCreada)="cargarTareas()"></app-create-task>

  <ng-container *ngFor="let task of tasksFiltradas">
    <div class="card-task">
      <div class="task-header">
        <ion-checkbox [(ngModel)]="task.completed" (ionChange)="guardarEstado(task)"></ion-checkbox>
        <h2 (click)="irADetalle(task)">{{ task.name }}</h2>
      </div>

      <p class="task-desc" (click)="irADetalle(task)">{{ task.description }}</p>

      <div class="task-footer">
        <span class="category">{{ task.category }}</span>
        <span class="date">{{ task.createdAt | date:'mediumDate' }}</span>
      </div>
    </div>
  </ng-container>

</ion-content>




<ion-modal #modalFiltro [breakpoints]="[0, 0.5, 1]" initialBreakpoint="0.5">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Filtrar por categoría</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modalFiltro.dismiss()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">

      <ion-item>
        <ion-label>Selecciona categorías</ion-label>
        <ion-select placeholder="Todas" [(ngModel)]="temporallyFilterCategories" multiple="true">
          <ion-select-option value="trabajo">Trabajo</ion-select-option>
          <ion-select-option value="personal">Personal</ion-select-option>
          <ion-select-option value="estudio">Estudio</ion-select-option>
          <ion-select-option *ngFor="let cat of categorias" [value]="cat.name">
            {{ cat.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>
      <ion-button expand="block" (click)="aplicarFiltro()">Aplicar filtro</ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
